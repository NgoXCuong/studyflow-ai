# Local development: frontend and backend run separately from their terminals.
# Set POSTGRES_PASSWORD in the root .env before starting Docker Compose.
services:
  mail:
    image: axllent/mailpit:v1
    profiles: [mail]
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: studyflow
      POSTGRES_USER: studyflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the root .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studyflow -d studyflow"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
